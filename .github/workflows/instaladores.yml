name: Instaladores

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  installers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: npm ci
      - run: npm test
      # gera o instalador do agente e, em seguida, o do servidor (que o inclui)
      - run: npm run installer -w @gestao/api
      - uses: actions/upload-artifact@v4
        with:
          name: Instaladores
          path: |
            apps/api/release/GestaoXmlServidor-Setup-*.exe
            apps/windows-agent/release/GestaoXmlAgent-Setup-*.exe
      - name: Anexar à release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="apps/api/release/GestaoXmlServidor-Setup-*.exe apps/windows-agent/release/GestaoXmlAgent-Setup-*.exe"
          gh release create "${GITHUB_REF_NAME}" $FILES --title "${GITHUB_REF_NAME}" --generate-notes || gh release upload "${GITHUB_REF_NAME}" $FILES --clobber
