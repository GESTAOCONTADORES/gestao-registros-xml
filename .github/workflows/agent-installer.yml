name: Instalador do agente

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  installer:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y nsis
      - run: npm ci
      - run: npm test
      - run: npm run installer -w @gestao/windows-agent
      - uses: actions/upload-artifact@v4
        with:
          name: GestaoXmlAgent-Setup
          path: apps/windows-agent/release/GestaoXmlAgent-Setup-*.exe
      - name: Anexar à release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" apps/windows-agent/release/GestaoXmlAgent-Setup-*.exe --title "${GITHUB_REF_NAME}" --generate-notes || gh release upload "${GITHUB_REF_NAME}" apps/windows-agent/release/GestaoXmlAgent-Setup-*.exe --clobber
